[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banana-eis-analysis"
version = "1.0.0"
description = "Equivalent-circuit fitting and MLP analysis of longitudinal banana bioimpedance measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eis-fit = "eisfit.cli:main"
eis-batch = "eisbatch.gui:launch"
eis-metadata = "eismetadata.gui:launch"
eis-ml-prepare = "eismlprep.gui:launch"
eis-ml = "eisml.gui:launch"
eis-noise = "eisnoise.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
